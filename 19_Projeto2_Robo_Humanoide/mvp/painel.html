<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferrão — painel de controle</title>
<style>
  :root{
    --fundo:#0e1512; --carta:#161f1b; --linha:#2a3833;
    --tinta:#e6ece8; --fraco:#859890;
    --ciano:#22d3ee; --verde:#5cb094; --ambar:#d99a4e; --vermelho:#e0645a;
    --mono:ui-monospace,"SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fundo);color:var(--tinta);
       font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:14px}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
         border-bottom:2px solid var(--linha);padding-bottom:12px;margin-bottom:18px}
  h1{font-size:23px;margin:0;letter-spacing:-.01em}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
       padding:3px 9px;border-radius:3px;background:#16302a;color:var(--verde)}
  .tag.fis{background:#2e2417;color:var(--ambar)}
  .grid{display:grid;grid-template-columns:1fr 340px;gap:18px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .carta{background:var(--carta);border:1px solid var(--linha);border-radius:6px;padding:16px}
  h2{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
     color:var(--fraco);margin:0 0 12px;font-weight:400}
  svg{width:100%;height:auto;display:block}
  .ctrl{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .ctrl label{flex:0 0 122px;font-size:12.5px;color:#b3c0ba}
  .ctrl input[type=range]{flex:1;accent-color:var(--ciano)}
  .ctrl .val{font-family:var(--mono);width:52px;text-align:right;font-size:12.5px}
  .btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
  button{background:#1d2a25;color:var(--tinta);border:1px solid var(--linha);
         border-radius:4px;padding:7px 12px;cursor:pointer;font-size:12.5px;font-family:inherit}
  button:hover{border-color:var(--ciano);color:var(--ciano)}
  button:focus-visible{outline:2px solid var(--ciano);outline-offset:2px}
  button.perigo{background:#331d1a;border-color:#5e2a24;color:var(--vermelho)}
  button.perigo:hover{background:var(--vermelho);color:#160b09}
  button.ativo{background:var(--ciano);color:#06181c;border-color:var(--ciano)}
  input[type=text]{width:100%;padding:8px 10px;background:var(--fundo);color:var(--tinta);
    border:1px solid var(--linha);border-radius:4px;font-family:inherit;font-size:13px}
  .log{font-family:var(--mono);font-size:11.5px;line-height:1.7;max-height:210px;overflow:auto}
  .log b{color:var(--fraco);font-weight:400}
  .kpi{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted var(--linha)}
  .kpi:last-child{border:0}
  .kpi b{font-family:var(--mono)}
  .aviso{background:#331d1a;border-left:3px solid var(--vermelho);padding:9px 12px;
         border-radius:0 4px 4px 0;font-size:12.5px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ferrão</h1>
    <span class="tag" id="tagModo">simulado</span>
    <span style="color:var(--fraco);font-size:12.5px">painel de controle · localhost:4700</span>
  </header>

  <div class="aviso" id="avisoEmerg"><b>EMERGÊNCIA ACIONADA</b> — os motores estão travados. Destrave para voltar a mover.</div>

  <div class="grid">
    <div class="carta">
      <h2>Robô</h2>
      <svg viewBox="0 0 460 520" id="robo">
        <!-- base -->
        <g stroke="#4a515c" stroke-width="7" stroke-linecap="round">
          <line x1="230" y1="452" x2="168" y2="480"/><line x1="230" y1="452" x2="292" y2="480"/>
          <line x1="230" y1="452" x2="200" y2="492"/><line x1="230" y1="452" x2="260" y2="492"/>
        </g>
        <g fill="#3a4149"><circle cx="168" cy="484" r="6"/><circle cx="292" cy="484" r="6"/>
          <circle cx="200" cy="496" r="5"/><circle cx="260" cy="496" r="5"/></g>
        <rect x="218" y="396" width="24" height="60" rx="5" fill="#565e6b"/>
        <!-- torso -->
        <rect x="164" y="212" width="132" height="192" rx="17" fill="#1a1f26" stroke="#0a0d10" stroke-width="2"/>
        <g stroke="#0d1116" stroke-width="2" opacity=".8">
          <line x1="182" y1="228" x2="182" y2="390"/><line x1="199" y1="224" x2="199" y2="394"/>
          <line x1="261" y1="224" x2="261" y2="394"/><line x1="278" y1="228" x2="278" y2="390"/>
        </g>
        <line x1="166" y1="330" x2="294" y2="330" stroke="#0e7490" stroke-width="6" opacity=".5"/>
        <line x1="166" y1="330" x2="294" y2="330" stroke="var(--ciano)" stroke-width="2"/>
        <rect x="198" y="248" width="64" height="50" rx="6" fill="#0a0f18" stroke="#22d3ee" stroke-width=".8" opacity=".85"/>
        <text x="230" y="277" text-anchor="middle" font-size="17" font-weight="bold" fill="#22d3ee">iK</text>
        <!-- slot impressora -->
        <rect x="204" y="356" width="52" height="7" rx="2.5" fill="#05070a" stroke="#3c424c"/>
        <!-- ombros -->
        <circle cx="164" cy="228" r="13" fill="#404752" stroke="#0a0d10" stroke-width="2"/>
        <circle cx="296" cy="228" r="13" fill="#404752" stroke="#0a0d10" stroke-width="2"/>
        <!-- bracos: girados por JS -->
        <g id="bracoE">
          <line x1="164" y1="228" x2="164" y2="300" stroke="#2f4570" stroke-width="15" stroke-linecap="round"/>
          <g id="anteE">
            <line x1="164" y1="300" x2="164" y2="360" stroke="#2f4570" stroke-width="12" stroke-linecap="round"/>
            <path id="garraE" d="M158 364 q-5 12 2 20 M170 364 q5 12 -2 20" stroke="#2f4570" stroke-width="4" fill="none" stroke-linecap="round"/>
          </g>
        </g>
        <g id="bracoD">
          <line x1="296" y1="228" x2="296" y2="300" stroke="#2f4570" stroke-width="15" stroke-linecap="round"/>
          <g id="anteD">
            <line x1="296" y1="300" x2="296" y2="360" stroke="#2f4570" stroke-width="12" stroke-linecap="round"/>
            <path id="garraD" d="M290 364 q-5 12 2 20 M302 364 q5 12 -2 20" stroke="#2f4570" stroke-width="4" fill="none" stroke-linecap="round"/>
          </g>
        </g>
        <!-- pescoco + cabeca -->
        <rect x="220" y="196" width="20" height="18" rx="4" fill="#565e6b"/>
        <g id="cabeca">
          <rect x="182" y="120" width="96" height="80" rx="18" fill="#1a1f26" stroke="#0a0d10" stroke-width="2"/>
          <rect x="192" y="132" width="76" height="40" rx="11" fill="#05080d"/>
          <g id="olhos"></g>
          <g fill="#0b0e13"><rect x="212" y="180" width="36" height="3" rx="1.5"/>
            <rect x="219" y="187" width="22" height="3" rx="1.5"/></g>
        </g>
        <!-- balao de fala -->
        <g id="balao" style="display:none">
          <rect x="300" y="120" width="150" height="40" rx="8" fill="#16302a" stroke="#5cb094"/>
          <text id="balaoTxt" x="310" y="145" font-size="11" fill="#e6ece8"></text>
        </g>
      </svg>
    </div>

    <div>
      <div class="carta" style="margin-bottom:14px">
        <h2>Rotinas</h2>
        <div class="btns" id="btnRotinas"></div>
        <h2 style="margin-top:16px">Expressão</h2>
        <div class="btns" id="btnRostos"></div>
        <h2 style="margin-top:16px">Falar</h2>
        <input type="text" id="txtFala" placeholder="Bem-vindo à clínica!" maxlength="120">
        <div class="btns">
          <button onclick="falar()">Falar</button>
          <button onclick="cmd({acao:'imprimir'})">Imprimir cupom</button>
        </div>
        <h2 style="margin-top:16px">Segurança</h2>
        <div class="btns">
          <button class="perigo" id="btnEmerg" onclick="toggleEmerg()">Parada de emergência</button>
        </div>
      </div>

      <div class="carta" style="margin-bottom:14px">
        <h2>Estado</h2>
        <div class="kpi"><span>Sensor esquerdo</span><b id="kSe">—</b></div>
        <div class="kpi"><span>Sensor direito</span><b id="kSd">—</b></div>
        <div class="kpi"><span>Cupons impressos</span><b id="kCup">0</b></div>
        <div class="kpi"><span>Rosto</span><b id="kRosto">—</b></div>
      </div>

      <div class="carta">
        <h2>Registro</h2>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

  <div class="carta" style="margin-top:18px">
    <h2>Juntas</h2>
    <div id="ctrls"></div>
  </div>
</div>

<script>
const API = "";
let juntas = {}, primeira = true;

async function cmd(body){
  try{
    const r = await fetch(API + "/comando", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
    return await r.json();
  }catch(e){ console.error(e); }
}

function mover(j, v){ cmd({acao:"mover", junta:j, angulo:Number(v)}); }
function falar(){
  const t = document.getElementById("txtFala").value.trim();
  if(t) cmd({acao:"falar", texto:t});
}
let emerg = false;
function toggleEmerg(){ emerg = !emerg; cmd({acao:"emergencia", ativar:emerg}); }

function montarControles(e){
  const box = document.getElementById("ctrls");
  box.innerHTML = "";
  for(const [id, j] of Object.entries(e.juntas)){
    const d = document.createElement("div"); d.className = "ctrl";
    d.innerHTML = `<label for="s_${id}">${j.nome}</label>
      <input type="range" id="s_${id}" min="${j.min}" max="${j.max}" value="${j.alvo}">
      <span class="val" id="v_${id}">${Math.round(j.atual)}°</span>`;
    box.appendChild(d);
    d.querySelector("input").addEventListener("input", ev => mover(id, ev.target.value));
  }
}

async function montarBotoes(){
  const r = await (await fetch(API + "/rotinas")).json();
  document.getElementById("btnRotinas").innerHTML =
    r.rotinas.map(n => `<button onclick="cmd({acao:'rotina',nome:'${n}'})">${n.replace(/_/g," ")}</button>`).join("");
  document.getElementById("btnRostos").innerHTML =
    r.expressoes.map(n => `<button class="rosto" data-r="${n}" onclick="cmd({acao:'rosto',expressao:'${n}'})">${n}</button>`).join("");
}

/* desenho dos olhos por expressão */
const OLHOS = {
  neutro:   `<circle cx="216" cy="152" r="7" fill="#22d3ee"/><circle cx="244" cy="152" r="7" fill="#22d3ee"/>`,
  atento:   `<circle cx="216" cy="152" r="9" fill="#22d3ee"/><circle cx="244" cy="152" r="9" fill="#22d3ee"/>`,
  pensando: `<circle cx="216" cy="150" r="7" fill="#22d3ee"/><circle cx="244" cy="150" r="4" fill="#22d3ee"/>`,
  feliz:    `<path d="M209 155 q7 -9 14 0" stroke="#22d3ee" stroke-width="3.5" fill="none" stroke-linecap="round"/>
             <path d="M237 155 q7 -9 14 0" stroke="#22d3ee" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
  confuso:  `<circle cx="216" cy="152" r="8" fill="#22d3ee"/><circle cx="244" cy="150" r="5" fill="#22d3ee"/>
             <path d="M236 138 q8 -5 16 0" stroke="#22d3ee" stroke-width="2" fill="none"/>`,
  alerta:   `<circle cx="216" cy="152" r="8" fill="#e0645a"/><circle cx="244" cy="152" r="8" fill="#e0645a"/>`,
  dormindo: `<path d="M208 152 h16" stroke="#5cb094" stroke-width="3.5" stroke-linecap="round"/>
             <path d="M236 152 h16" stroke="#5cb094" stroke-width="3.5" stroke-linecap="round"/>`
};

function girar(el, grausX, grausY, pivoX, pivoY){
  el.setAttribute("transform", `rotate(${grausX} ${pivoX} ${pivoY})`);
}

function desenhar(e){
  const j = e.juntas;
  // braços: ângulo da junta vira rotação no SVG (espelhado no lado esquerdo)
  girar(document.getElementById("bracoE"), -j.ombro_e.atual, 0, 164, 228);
  girar(document.getElementById("bracoD"),  j.ombro_d.atual, 0, 296, 228);
  girar(document.getElementById("anteE"), -j.cotovelo_e.atual, 0, 164, 300);
  girar(document.getElementById("anteD"),  j.cotovelo_d.atual, 0, 296, 300);
  // cabeça: pan gira, tilt inclina de leve
  document.getElementById("cabeca").setAttribute("transform",
    `rotate(${j.pescoco_tilt.atual*0.4} 230 200) translate(${j.pescoco_pan.atual*0.35} 0)`);
  // garra abre conforme o ângulo
  const ab = 1 + j.garra.atual/60;
  document.getElementById("garraE").setAttribute("transform", `scale(${ab} 1) translate(${164*(1-ab)/ab} 0)`);
  document.getElementById("garraD").setAttribute("transform", `scale(${ab} 1) translate(${296*(1-ab)/ab} 0)`);

  document.getElementById("olhos").innerHTML = OLHOS[e.rosto] || OLHOS.neutro;

  const bal = document.getElementById("balao");
  if(e.fala){ bal.style.display = ""; document.getElementById("balaoTxt").textContent = e.fala.slice(0,26); }
  else bal.style.display = "none";

  for(const [id, jj] of Object.entries(j)){
    const v = document.getElementById("v_" + id);
    if(v) v.textContent = Math.round(jj.atual) + "°";
  }

  document.getElementById("kSe").textContent = e.sensores.dist_esq + " cm";
  document.getElementById("kSd").textContent = e.sensores.dist_dir + " cm";
  document.getElementById("kCup").textContent = e.cupons;
  document.getElementById("kRosto").textContent = e.rosto;
  document.getElementById("tagModo").textContent = e.modo;
  document.getElementById("tagModo").className = "tag" + (e.modo === "simulado" ? "" : " fis");
  document.getElementById("avisoEmerg").style.display = e.emergencia ? "block" : "none";
  document.getElementById("btnEmerg").textContent =
    e.emergencia ? "Destravar emergência" : "Parada de emergência";
  emerg = e.emergencia;

  document.querySelectorAll(".rosto").forEach(b =>
    b.classList.toggle("ativo", b.dataset.r === e.rosto));

  document.getElementById("log").innerHTML =
    e.log.map(l => `<div><b>${l.t}</b> ${l.msg}</div>`).join("");
}

async function ciclo(){
  try{
    const e = await (await fetch(API + "/estado")).json();
    if(primeira){ montarControles(e); primeira = false; }
    desenhar(e);
  }catch(err){}
  setTimeout(ciclo, 120);
}

montarBotoes();
ciclo();
</script>
</body>
</html>
