<svg viewBox="0 0 900 1170" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="1170" fill="#f8f9fb"/>

  <!-- Título -->
  <text x="450" y="42" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e2a4a">FERRÃO — vista lateral (perfil do ombro, o coração do projeto)</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#64748b">Visto do lado esquerdo do robô · a frente é pra direita →</text>
  <text x="450" y="86" text-anchor="middle" font-size="12" fill="#94a3b8">A mala é a pele; a lateral de MDF por dentro é o osso — o motor prende na madeira, não no plástico</text>

  <!-- seta de frente -->
  <g stroke="#94a3b8" stroke-width="2" fill="#94a3b8">
    <line x1="700" y1="130" x2="780" y2="130"/>
    <polygon points="780,124 794,130 780,136"/>
  </g>
  <text x="740" y="118" text-anchor="middle" font-size="12" fill="#64748b">frente</text>

  <!-- chão -->
  <line x1="80" y1="1090" x2="820" y2="1090" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== BASE (perfil) ===== -->
  <g stroke="#374151" stroke-width="14" stroke-linecap="round">
    <line x1="450" y1="1005" x2="330" y2="1055"/>
    <line x1="450" y1="1005" x2="570" y2="1055"/>
  </g>
  <g fill="#4b5563" stroke="#1e2a4a" stroke-width="2">
    <circle cx="330" cy="1068" r="11"/>
    <circle cx="570" cy="1068" r="11"/>
  </g>
  <rect x="344" y="1074" width="26" height="14" fill="#d9b98c" stroke="#1e2a4a" stroke-width="1.5"/>
  <rect x="530" y="1074" width="26" height="14" fill="#d9b98c" stroke="#1e2a4a" stroke-width="1.5"/>
  <ellipse cx="450" cy="1052" rx="48" ry="18" fill="#6b7280" stroke="#1e2a4a" stroke-width="2"/>
  <text x="450" y="1057" text-anchor="middle" font-size="11" fill="#f8f9fb">lastro</text>

  <!-- coluna a gás -->
  <rect x="428" y="878" width="44" height="127" rx="6" fill="#9ca3af" stroke="#1e2a4a" stroke-width="2"/>
  <rect x="436" y="772" width="28" height="110" rx="4" fill="#b6bcc6" stroke="#1e2a4a" stroke-width="2"/>

  <!-- disco MDF -->
  <rect x="330" y="750" width="240" height="18" rx="6" fill="#d9b98c" stroke="#1e2a4a" stroke-width="2"/>

  <!-- ===== TORSO: casca da mala de perfil ===== -->
  <rect x="386" y="440" width="128" height="310" rx="24" fill="#26314d" stroke="#1e2a4a" stroke-width="2.5"/>
  <!-- zíper contornando a mala -->
  <path d="M 400 458 L 400 730 M 500 458 L 500 730" fill="none" stroke="#8b94a3" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="500" cy="486" r="5" fill="#8b94a3"/>

  <!-- lateral de MDF por dentro (o osso) -->
  <rect x="404" y="462" width="96" height="286" fill="#d9b98c" opacity="0.85" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- eletrônica escondida atrás -->
  <rect x="412" y="646" width="80" height="52" rx="5" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="452" y="668" text-anchor="middle" font-size="10" fill="#f1f5f9">eletrônica</text>
  <text x="452" y="682" text-anchor="middle" font-size="10" fill="#f1f5f9">(atrás)</text>

  <!-- ===== CABEÇA: necessaire de perfil ===== -->
  <rect x="398" y="318" width="106" height="112" rx="20" fill="#26314d" stroke="#1e2a4a" stroke-width="2.5"/>
  <!-- zíper da necessaire -->
  <path d="M 408 332 L 494 332" fill="none" stroke="#8b94a3" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- visor de acrílico fumê na face frontal -->
  <rect x="492" y="342" width="14" height="56" rx="5" fill="#10151f" stroke="#0b1018" stroke-width="1.5"/>
  <!-- TFT logo atrás do acrílico (tracejado) -->
  <rect x="476" y="346" width="12" height="30" rx="3" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- HC-SR04 atrás do mesmo visor, apontando pra frente -->
  <rect x="474" y="380" width="18" height="16" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
  <g fill="none" stroke="#94a3b8" stroke-width="1.8" opacity="0.8">
    <path d="M 512 380 q 12 8 0 16"/>
    <path d="M 522 374 q 20 14 0 28"/>
  </g>
  <!-- servo tilt -->
  <rect x="436" y="430" width="28" height="20" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <!-- arco do tilt -->
  <path d="M 528 322 q 24 30 10 62" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- ===== ARCO DE TRABALHO DO BRAÇO ===== -->
  <path d="M 414 697 A 210 210 0 0 0 647 418" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="7 6" opacity="0.65"/>
  <polygon points="640,408 654,414 645,426" fill="#3b82f6" opacity="0.65"/>
  <polygon points="406,690 412,706 422,694" fill="#3b82f6" opacity="0.65"/>

  <!-- ===== OMBRO: motor de perfil, parafusado na madeira interna ===== -->
  <rect x="392" y="462" width="52" height="42" rx="8" fill="#4b5563" stroke="#1e2a4a" stroke-width="2"/>
  <rect x="406" y="450" width="88" height="80" rx="14" fill="#4b5563" stroke="#1e2a4a" stroke-width="2"/>
  <!-- parafusos M6 do motor na lateral de MDF -->
  <g fill="#e5e7eb">
    <circle cx="416" cy="458" r="3"/>
    <circle cx="416" cy="522" r="3"/>
    <circle cx="484" cy="490" r="3"/>
  </g>
  <!-- pot coaxial na face interna (tracejado) -->
  <circle cx="450" cy="490" r="28" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- eixo do ombro, atravessando a casca -->
  <circle cx="450" cy="490" r="18" fill="#374151" stroke="#1e2a4a" stroke-width="2"/>
  <circle cx="450" cy="490" r="7" fill="#e5e7eb" stroke="#1e2a4a" stroke-width="1.5"/>

  <!-- ===== BRAÇO de alumínio (35° pra frente) ===== -->
  <g transform="rotate(-35 450 490)">
    <rect x="437" y="486" width="26" height="176" rx="3" fill="#cbd5e1" stroke="#1e2a4a" stroke-width="2"/>
    <line x1="444" y1="496" x2="444" y2="654" stroke="#eef2f6" stroke-width="3"/>
    <g transform="rotate(-12 450 662)">
      <rect x="432" y="662" width="36" height="30" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
      <rect x="440" y="692" width="20" height="106" rx="3" fill="#cbd5e1" stroke="#1e2a4a" stroke-width="2"/>
      <line x1="446" y1="700" x2="446" y2="792" stroke="#eef2f6" stroke-width="2.5"/>
      <rect x="436" y="798" width="28" height="10" rx="3" fill="#d9b98c" stroke="#1e2a4a" stroke-width="1.5"/>
      <path d="M 440 808 C 430 824 432 840 446 850" fill="none" stroke="#1e2a4a" stroke-width="6" stroke-linecap="round"/>
      <path d="M 460 808 C 470 824 468 840 454 850" fill="none" stroke="#1e2a4a" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ===== FINS-DE-CURSO ===== -->
  <rect x="424" y="602" width="14" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <rect x="470" y="446" width="14" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>

  <!-- ===== CALLOUTS ===== -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <!-- esquerda -->
    <line x1="230" y1="340" x2="396" y2="348"/>
    <line x1="235" y1="452" x2="390" y2="472"/>
    <line x1="250" y1="497" x2="424" y2="494"/>
    <line x1="230" y1="562" x2="428" y2="530"/>
    <line x1="215" y1="609" x2="422" y2="609"/>
    <line x1="225" y1="700" x2="384" y2="700"/>
    <line x1="225" y1="742" x2="406" y2="726"/>
    <line x1="230" y1="900" x2="428" y2="900"/>
    <!-- direita -->
    <line x1="655" y1="360" x2="510" y2="368"/>
    <line x1="662" y1="440" x2="486" y2="452"/>
    <line x1="668" y1="490" x2="470" y2="490"/>
    <line x1="690" y1="586" x2="614" y2="560"/>
    <line x1="672" y1="640" x2="580" y2="636"/>
    <line x1="700" y1="770" x2="668" y2="778"/>
  </g>
  <g fill="#94a3b8">
    <circle cx="396" cy="348" r="3"/><circle cx="390" cy="472" r="3"/><circle cx="424" cy="494" r="3"/>
    <circle cx="428" cy="530" r="3"/><circle cx="422" cy="609" r="3"/><circle cx="384" cy="700" r="3"/>
    <circle cx="406" cy="726" r="3"/><circle cx="428" cy="900" r="3"/>
    <circle cx="510" cy="368" r="3"/><circle cx="486" cy="452" r="3"/><circle cx="470" cy="490" r="3"/>
    <circle cx="614" cy="560" r="3"/><circle cx="580" cy="636" r="3"/><circle cx="668" cy="778" r="3"/>
  </g>
  <g font-size="13" fill="#334155">
    <!-- esquerda -->
    <text x="225" y="337" text-anchor="end">Crânio: necessaire de perfil</text>
    <text x="230" y="449" text-anchor="end">Redução sem-fim do motor</text>
    <text x="230" y="463" text-anchor="end" font-size="11" fill="#64748b">(autotravante: segura o braço desligado)</text>
    <text x="245" y="494" text-anchor="end">Corpo do motor de limpador</text>
    <text x="225" y="559" text-anchor="end">Pot de feedback coaxial</text>
    <text x="225" y="573" text-anchor="end" font-size="11" fill="#64748b">(tracejado: fica na face interna)</text>
    <text x="210" y="606" text-anchor="end">Fim-de-curso inferior</text>
    <text x="220" y="697" text-anchor="end">Casca da mala rígida (a pele)</text>
    <text x="220" y="739" text-anchor="end">Lateral de MDF por dentro (o osso)</text>
    <text x="220" y="753" text-anchor="end" font-size="11" fill="#64748b">é aqui que o motor é parafusado</text>
    <text x="225" y="897" text-anchor="end">Coluna da cadeira</text>
    <!-- direita -->
    <text x="660" y="357" text-anchor="start">Rosto e olhos atrás do mesmo visor</text>
    <text x="660" y="371" text-anchor="start" font-size="11" fill="#64748b">TFT 2,4" + 2× HC-SR04 sob acrílico fumê</text>
    <text x="667" y="437" text-anchor="start">Fim-de-curso superior</text>
    <text x="667" y="451" text-anchor="start" font-size="11" fill="#64748b">(tocou → software corta o motor)</text>
    <text x="673" y="487" text-anchor="start">Eixo do ombro = eixo do motor</text>
    <text x="673" y="501" text-anchor="start" font-size="11" fill="#64748b">(rolamento 608 de apoio do outro lado)</text>
    <text x="695" y="583" text-anchor="start">Arco de trabalho ≈ 120°</text>
    <text x="695" y="597" text-anchor="start" font-size="11" fill="#64748b">(limitado por software + switches)</text>
    <text x="677" y="637" text-anchor="start">Cotovelo MG996R</text>
    <text x="677" y="651" text-anchor="start" font-size="11" fill="#64748b">embutido no tubo de alumínio</text>
    <text x="705" y="767" text-anchor="start">Garra por tendão</text>
  </g>

  <!-- legenda -->
  <g font-size="12" fill="#334155">
    <rect x="90" y="1118" width="18" height="14" fill="#26314d" stroke="#1e2a4a" stroke-width="1.5"/>
    <text x="115" y="1130">Mala / necessaire (casca)</text>
    <rect x="288" y="1118" width="18" height="14" fill="#d9b98c" stroke="#1e2a4a" stroke-width="1.5"/>
    <text x="313" y="1130">MDF (osso interno)</text>
    <rect x="448" y="1118" width="18" height="14" fill="#cbd5e1" stroke="#1e2a4a" stroke-width="1.5"/>
    <text x="473" y="1130">Alumínio</text>
    <rect x="560" y="1118" width="18" height="14" fill="#4b5563" stroke="#1e2a4a" stroke-width="1.5"/>
    <text x="585" y="1130">Metal (sucata)</text>
    <rect x="690" y="1118" width="18" height="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="715" y="1130">Eletrônica</text>
  </g>
</svg>
