<svg viewBox="0 0 1000 1680" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="1680" fill="#ffffff"/>

  <text x="500" y="52" text-anchor="middle" font-size="31" font-weight="bold" fill="#16213d">PRANCHA DO OMBRO</text>
  <text x="500" y="82" text-anchor="middle" font-size="18" fill="#475569">O motor de limpador na mala — a junta que sustenta o braço</text>
  <line x1="50" y1="100" x2="950" y2="100" stroke="#94a3b8" stroke-width="2"/>

  <!-- ══════════ PAINEL A ══════════ -->
  <rect x="50" y="120" width="900" height="38" fill="#2563eb"/>
  <text x="66" y="147" font-size="21" font-weight="bold" fill="#ffffff">A · O QUE É O MOTOR DE LIMPADOR</text>

  <!-- desenho do motor -->
  <rect x="90" y="210" width="150" height="104" rx="22" fill="#7c848f" stroke="#1e293b" stroke-width="3"/>
  <ellipse cx="90" cy="262" rx="15" ry="52" fill="#5c646f" stroke="#1e293b" stroke-width="3"/>
  <path d="M 240 216 L 342 206 Q 370 204 370 232 L 370 298 Q 370 324 342 320 L 240 310 Z"
        fill="#5c646f" stroke="#1e293b" stroke-width="3"/>
  <rect x="366" y="248" width="62" height="26" rx="4" fill="#9aa3ae" stroke="#1e293b" stroke-width="3"/>
  <g stroke="#1e293b" stroke-width="1.6">
    <line x1="394" y1="248" x2="394" y2="274"/><line x1="404" y1="248" x2="404" y2="274"/>
    <line x1="414" y1="248" x2="414" y2="274"/>
  </g>
  <circle cx="432" cy="261" r="9" fill="#cbd5e1" stroke="#1e293b" stroke-width="2.5"/>
  <g fill="#5c646f" stroke="#1e293b" stroke-width="3">
    <path d="M 258 206 L 286 176 L 310 188 L 290 212 Z"/>
    <path d="M 258 318 L 286 348 L 310 336 L 290 312 Z"/>
    <path d="M 356 210 L 384 188 L 398 208 L 374 226 Z"/>
  </g>
  <g fill="#ffffff" stroke="#1e293b" stroke-width="2.5">
    <circle cx="288" cy="192" r="8"/><circle cx="288" cy="332" r="8"/><circle cx="380" cy="207" r="7.5"/>
  </g>
  <rect x="120" y="314" width="42" height="20" rx="4" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <line x1="141" y1="334" x2="141" y2="362" stroke="#dc2626" stroke-width="4"/>
  <line x1="151" y1="334" x2="157" y2="362" stroke="#1e293b" stroke-width="4"/>

  <!-- callouts A -->
  <g stroke="#64748b" stroke-width="1.6">
    <line x1="288" y1="192" x2="520" y2="186"/>
    <line x1="330" y1="264" x2="520" y2="330"/>
    <line x1="420" y1="240" x2="520" y2="248"/>
    <line x1="146" y1="352" x2="100" y2="380"/>
  </g>
  <g font-size="17" fill="#1e293b">
    <text x="530" y="180" font-weight="bold">3 orelhas de fixação (M6)</text>
    <text x="530" y="204" font-size="15" fill="#b91c1c">USE OS FUROS QUE JÁ EXISTEM</text>
    <text x="530" y="248" font-weight="bold">Eixo estriado + porca</text>
    <text x="530" y="272" font-size="15" fill="#475569">aqui entra o clamp do limpador</text>
    <text x="530" y="330" font-weight="bold">Caixa de redução</text>
    <text x="530" y="354" font-size="15" fill="#475569">é ela que trava o braço sozinho</text>
    <text x="96" y="386" text-anchor="end" font-size="16">2 fios: 12 V</text>
  </g>

  <!-- aviso -->
  <rect x="50" y="410" width="900" height="76" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="72" y="440" font-size="18" font-weight="bold" fill="#b91c1c">MEDIR ANTES DE FURAR</text>
  <text x="72" y="468" font-size="16" fill="#7f1d1d">Cada montadora usa medida diferente. Meça o SEU motor: distância entre orelhas e diâmetro do eixo.</text>

  <!-- ══════════ PAINEL B ══════════ -->
  <rect x="50" y="516" width="900" height="38" fill="#2563eb"/>
  <text x="66" y="543" font-size="21" font-weight="bold" fill="#ffffff">B · COMO PRENDER SEM RASGAR A MALA</text>
  <text x="50" y="582" font-size="16" fill="#475569">Corte visto de cima. O parafuso atravessa tudo e morde a MADEIRA — nunca só o plástico.</text>

  <text x="120" y="622" font-size="16" font-weight="bold" fill="#64748b">FORA</text>
  <text x="700" y="622" font-size="16" font-weight="bold" fill="#64748b">DENTRO DA MALA</text>

  <!-- motor -->
  <rect x="80" y="640" width="170" height="200" rx="12" fill="#7c848f" stroke="#1e293b" stroke-width="3"/>
  <text x="165" y="748" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">MOTOR</text>
  <rect x="250" y="676" width="42" height="32" fill="#5c646f" stroke="#1e293b" stroke-width="2.5"/>
  <rect x="250" y="772" width="42" height="32" fill="#5c646f" stroke="#1e293b" stroke-width="2.5"/>

  <!-- casca + madeira -->
  <rect x="292" y="600" width="14" height="300" fill="#1f2937" stroke="#0f172a" stroke-width="2"/>
  <rect x="306" y="600" width="64" height="300" fill="#d9b98c" stroke="#8a6d3b" stroke-width="2.5"/>
  <g stroke="#b8956a" stroke-width="1.2">
    <line x1="318" y1="604" x2="318" y2="896"/><line x1="334" y1="604" x2="334" y2="896"/>
    <line x1="352" y1="604" x2="352" y2="896"/>
  </g>

  <!-- parafusos -->
  <g>
    <rect x="240" y="686" width="158" height="13" fill="#475569" stroke="#1e293b" stroke-width="1.8"/>
    <rect x="226" y="679" width="16" height="27" rx="3" fill="#334155" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="240" y="677" width="11" height="31" fill="#94a3b8" stroke="#1e293b" stroke-width="1.8"/>
    <rect x="370" y="677" width="11" height="31" fill="#94a3b8" stroke="#1e293b" stroke-width="1.8"/>
    <rect x="381" y="679" width="22" height="27" rx="4" fill="#fcd34d" stroke="#92400e" stroke-width="2.5"/>
    <rect x="240" y="782" width="158" height="13" fill="#475569" stroke="#1e293b" stroke-width="1.8"/>
    <rect x="226" y="775" width="16" height="27" rx="3" fill="#334155" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="240" y="773" width="11" height="31" fill="#94a3b8" stroke="#1e293b" stroke-width="1.8"/>
    <rect x="370" y="773" width="11" height="31" fill="#94a3b8" stroke="#1e293b" stroke-width="1.8"/>
    <rect x="381" y="775" width="22" height="27" rx="4" fill="#fcd34d" stroke="#92400e" stroke-width="2.5"/>
  </g>
  <!-- eixo -->
  <rect x="250" y="726" width="120" height="28" fill="#9aa3ae" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="292" y1="712" x2="306" y2="712" stroke="#dc2626" stroke-width="3"/>
  <line x1="292" y1="768" x2="306" y2="768" stroke="#dc2626" stroke-width="3"/>

  <!-- callouts B -->
  <g stroke="#64748b" stroke-width="1.6">
    <line x1="299" y1="616" x2="430" y2="640"/>
    <line x1="338" y1="616" x2="470" y2="694"/>
    <line x1="392" y1="692" x2="470" y2="754"/>
    <line x1="330" y1="740" x2="440" y2="836"/>
    <line x1="234" y1="796" x2="180" y2="876"/>
  </g>
  <g font-size="17" fill="#1e293b">
    <text x="440" y="636" font-weight="bold">Casca da mala: só 2-3 mm</text>
    <text x="440" y="660" font-size="15" fill="#b91c1c">sozinha ela RASGA</text>
    <text x="480" y="690" font-weight="bold">Madeira 15 mm (do caixote)</text>
    <text x="480" y="714" font-size="15" fill="#475569">é o "osso" — segura a força</text>
    <text x="480" y="754" font-weight="bold">Porca nylock + arruela</text>
    <text x="480" y="778" font-size="15" fill="#475569">nylock não afrouxa</text>
    <text x="450" y="840" font-weight="bold">Furo do eixo COM FOLGA</text>
    <text x="450" y="864" font-size="15" fill="#475569">Ø 30 mm · não pode encostar</text>
    <text x="80" y="898" font-weight="bold">Parafuso M6 passante</text>
    <text x="80" y="922" font-size="15" fill="#475569">arruela larga dos DOIS lados</text>
  </g>

  <!-- ══════════ PAINEL C ══════════ -->
  <rect x="50" y="952" width="900" height="38" fill="#2563eb"/>
  <text x="66" y="979" font-size="21" font-weight="bold" fill="#ffffff">C · ORDEM DE MONTAGEM — não pule etapa</text>

  <g>
    <circle cx="82" cy="1032" r="19" fill="#2563eb"/>
    <text x="82" y="1039" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">1</text>
    <text x="118" y="1028" font-size="18" font-weight="bold" fill="#1e293b">Corte a madeira ANTES de furar a mala.</text>
    <text x="118" y="1052" font-size="16" fill="#475569">Bem maior que o motor: sobre ~5 cm por lado.</text>

    <circle cx="82" cy="1102" r="19" fill="#2563eb"/>
    <text x="82" y="1109" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">2</text>
    <text x="118" y="1098" font-size="18" font-weight="bold" fill="#1e293b">Use o motor como gabarito.</text>
    <text x="118" y="1122" font-size="16" fill="#475569">Apoie na madeira e marque os furos com caneta. Zero medição, zero erro.</text>

    <circle cx="82" cy="1172" r="19" fill="#2563eb"/>
    <text x="82" y="1179" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">3</text>
    <text x="118" y="1168" font-size="18" font-weight="bold" fill="#1e293b">Fure a madeira (broca 6 mm) e teste o motor nela, fora da mala.</text>
    <text x="118" y="1192" font-size="16" fill="#475569">Se errar aqui, joga fora um pedaço de caixote — não a mala.</text>

    <circle cx="82" cy="1242" r="19" fill="#2563eb"/>
    <text x="82" y="1249" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">4</text>
    <text x="118" y="1238" font-size="18" font-weight="bold" fill="#1e293b">Só agora marque a mala, usando a madeira como molde.</text>
    <text x="118" y="1262" font-size="16" fill="#475569">Furos M6 com broca 6,5 mm. Furo do eixo com SERRA-COPO Ø 30 mm.</text>

    <circle cx="82" cy="1312" r="19" fill="#2563eb"/>
    <text x="82" y="1319" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">5</text>
    <text x="118" y="1308" font-size="18" font-weight="bold" fill="#1e293b">Monte o sanduíche: motor · casca · madeira.</text>
    <text x="118" y="1332" font-size="16" fill="#475569">M6 de fora pra dentro, arruela nos dois lados, nylock por dentro.</text>

    <circle cx="82" cy="1382" r="19" fill="#2563eb"/>
    <text x="82" y="1389" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">6</text>
    <text x="118" y="1378" font-size="18" font-weight="bold" fill="#1e293b">Teste de tração antes de pendurar o braço.</text>
    <text x="118" y="1402" font-size="16" fill="#475569">Pendure ~3 kg no eixo por 1 minuto. Deformou? Aumente a madeira.</text>
  </g>

  <!-- erros -->
  <rect x="50" y="1442" width="900" height="180" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="72" y="1478" font-size="19" font-weight="bold" fill="#92400e">OS 4 ERROS QUE ESTRAGAM ESSA JUNTA</text>
  <g font-size="16" fill="#78350f">
    <text x="72" y="1512">1 · Parafusar só na casca — rasga em dias e o furo alargado não tem conserto.</text>
    <text x="72" y="1540">2 · Furo do eixo justo — encosta, esquenta e trava. Sempre 3-5 mm de folga.</text>
    <text x="72" y="1568">3 · Broca grande no lugar de serra-copo — trinca o plástico rígido.</text>
    <text x="72" y="1596">4 · Porca comum no lugar de nylock — afrouxa em menos de uma semana.</text>
  </g>

  <text x="500" y="1656" text-anchor="middle" font-size="14" fill="#94a3b8">Projeto Ferrão · prancha do ombro · 25/07/2026</text>
</svg>
