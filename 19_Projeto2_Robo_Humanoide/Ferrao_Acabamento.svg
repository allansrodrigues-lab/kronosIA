<svg viewBox="0 0 900 1080" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e8edf4"/>
    </linearGradient>
    <linearGradient id="mala" gradientUnits="userSpaceOnUse" x1="330" y1="0" x2="570" y2="0">
      <stop offset="0%" stop-color="#16213d"/>
      <stop offset="42%" stop-color="#2a3a63"/>
      <stop offset="100%" stop-color="#16213d"/>
    </linearGradient>
    <linearGradient id="cabeca" gradientUnits="userSpaceOnUse" x1="372" y1="0" x2="528" y2="0">
      <stop offset="0%" stop-color="#16213d"/>
      <stop offset="45%" stop-color="#28375e"/>
      <stop offset="100%" stop-color="#16213d"/>
    </linearGradient>
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1080">
      <stop offset="0%" stop-color="#5b6678"/>
      <stop offset="100%" stop-color="#333b4a"/>
    </linearGradient>
    <radialGradient id="olho">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="35%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="brilho">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1080" fill="url(#fundo)"/>

  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#16213d">FERRÃO — acabado, com torso de MALA RÍGIDA</text>
  <text x="450" y="60" text-anchor="middle" font-size="12.5" fill="#64748b">A mala é a pele (carcaça pronta) · o quadro de madeira por dentro continua sendo o osso</text>

  <ellipse cx="450" cy="1000" rx="170" ry="19" fill="#94a3b8" opacity="0.28"/>

  <!-- ====== BASE (cadeira) ====== -->
  <g stroke="#2b3446" stroke-width="15" stroke-linecap="round">
    <line x1="450" y1="935" x2="302" y2="985"/>
    <line x1="450" y1="935" x2="598" y2="985"/>
    <line x1="450" y1="935" x2="372" y2="1000"/>
    <line x1="450" y1="935" x2="528" y2="1000"/>
  </g>
  <g fill="#3f4756" stroke="#16213d" stroke-width="2">
    <circle cx="302" cy="994" r="11"/><circle cx="598" cy="994" r="11"/>
    <circle cx="372" cy="1006" r="9"/><circle cx="528" cy="1006" r="9"/>
  </g>
  <path d="M 374 900 L 526 900 L 544 958 Q 450 974 356 958 Z" fill="#1b2743" stroke="#0f172a" stroke-width="2"/>
  <line x1="380" y1="931" x2="520" y2="931" stroke="#22d3ee" stroke-width="2.5" opacity="0.75"/>

  <!-- coluna -->
  <rect x="426" y="748" width="48" height="158" rx="10" fill="url(#metal)" stroke="#16213d" stroke-width="2"/>
  <line x1="442" y1="768" x2="442" y2="888" stroke="#1e293b" stroke-width="1.5" opacity="0.55"/>
  <line x1="458" y1="768" x2="458" y2="888" stroke="#1e293b" stroke-width="1.5" opacity="0.55"/>

  <!-- ====== TORSO = MALA RIGIDA ====== -->
  <rect x="336" y="438" width="228" height="312" rx="34" fill="url(#mala)" stroke="#0f172a" stroke-width="2.5"/>
  <!-- frisos verticais tipicos de mala rigida -->
  <g stroke="#0f172a" stroke-width="2" opacity="0.42">
    <line x1="372" y1="470" x2="372" y2="720"/>
    <line x1="404" y1="462" x2="404" y2="728"/>
    <line x1="496" y1="462" x2="496" y2="728"/>
    <line x1="528" y1="470" x2="528" y2="720"/>
  </g>
  <g stroke="#4c5f8f" stroke-width="1" opacity="0.35">
    <line x1="375" y1="470" x2="375" y2="720"/>
    <line x1="407" y1="462" x2="407" y2="728"/>
    <line x1="499" y1="462" x2="499" y2="728"/>
    <line x1="531" y1="470" x2="531" y2="720"/>
  </g>
  <!-- linha do ziper (abre pra manutencao) -->
  <path d="M 336 610 L 564 610" stroke="#0f172a" stroke-width="3.5" opacity="0.8"/>
  <path d="M 336 610 L 564 610" stroke="#7b8ab5" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.75"/>
  <!-- cantoneiras de protecao -->
  <path d="M 336 476 Q 336 438 374 438" fill="none" stroke="#4b5563" stroke-width="7" stroke-linecap="round"/>
  <path d="M 564 476 Q 564 438 526 438" fill="none" stroke="#4b5563" stroke-width="7" stroke-linecap="round"/>
  <path d="M 336 712 Q 336 750 374 750" fill="none" stroke="#4b5563" stroke-width="7" stroke-linecap="round"/>
  <path d="M 564 712 Q 564 750 526 750" fill="none" stroke="#4b5563" stroke-width="7" stroke-linecap="round"/>

  <!-- painel de identidade -->
  <rect x="392" y="498" width="116" height="96" rx="12" fill="#101a30" stroke="#0f172a" stroke-width="2"/>
  <rect x="392" y="498" width="116" height="96" rx="12" fill="none" stroke="#22d3ee" stroke-width="1.1" opacity="0.45"/>
  <text x="450" y="546" text-anchor="middle" font-size="32" font-weight="bold" fill="#22d3ee" letter-spacing="2">iK</text>
  <text x="450" y="566" text-anchor="middle" font-size="9.5" fill="#64748b" letter-spacing="3">FERRÃO</text>
  <rect x="410" y="576" width="80" height="6" rx="3" fill="#1e293b"/>
  <rect x="410" y="576" width="54" height="6" rx="3" fill="#22d3ee"/>

