  <g fill="#0b1424" opacity="0.7">
    <rect x="352" y="512" width="14" height="4" rx="2"/><rect x="352" y="522" width="14" height="4" rx="2"/>
    <rect x="352" y="532" width="14" height="4" rx="2"/>
    <rect x="534" y="512" width="14" height="4" rx="2"/><rect x="534" y="522" width="14" height="4" rx="2"/>
    <rect x="534" y="532" width="14" height="4" rx="2"/>
  </g>
  <!-- fita LED interna vazando pela linha do ziper -->
  <line x1="352" y1="662" x2="548" y2="662" stroke="#22d3ee" stroke-width="3" opacity="0.85"/>
  <ellipse cx="450" cy="662" rx="122" ry="15" fill="url(#brilho)"/>

  <!-- ====== OMBROS (sobre reforco interno) ====== -->
  <circle cx="336" cy="470" r="29" fill="url(#metal)" stroke="#16213d" stroke-width="2.5"/>
  <circle cx="564" cy="470" r="29" fill="url(#metal)" stroke="#16213d" stroke-width="2.5"/>
  <circle cx="336" cy="470" r="10" fill="#101a30" stroke="#22d3ee" stroke-width="1.5"/>
  <circle cx="564" cy="470" r="10" fill="#101a30" stroke="#22d3ee" stroke-width="1.5"/>

  <!-- ====== BRACO ESQUERDO (repouso) - cor solida ====== -->
  <line x1="336" y1="470" x2="322" y2="600" stroke="#243357" stroke-width="34" stroke-linecap="round"/>
  <line x1="336" y1="470" x2="322" y2="600" stroke="#2f4270" stroke-width="22" stroke-linecap="round"/>
  <line x1="320" y1="604" x2="312" y2="712" stroke="#243357" stroke-width="28" stroke-linecap="round"/>
  <line x1="320" y1="604" x2="312" y2="712" stroke="#2f4270" stroke-width="17" stroke-linecap="round"/>
  <circle cx="321" cy="602" r="16" fill="#4b5563" stroke="#16213d" stroke-width="2"/>
  <circle cx="321" cy="602" r="5.5" fill="#22d3ee" opacity="0.9"/>
  <path d="M 302 718 q -8 22 4 38" fill="none" stroke="#2f4270" stroke-width="8" stroke-linecap="round"/>
  <path d="M 320 718 q 9 22 -3 38" fill="none" stroke="#2f4270" stroke-width="8" stroke-linecap="round"/>

  <!-- ====== BRACO DIREITO (aceno) ====== -->
  <line x1="564" y1="470" x2="646" y2="402" stroke="#243357" stroke-width="34" stroke-linecap="round"/>
  <line x1="564" y1="470" x2="646" y2="402" stroke="#2f4270" stroke-width="22" stroke-linecap="round"/>
  <line x1="648" y1="400" x2="678" y2="300" stroke="#243357" stroke-width="28" stroke-linecap="round"/>
  <line x1="648" y1="400" x2="678" y2="300" stroke="#2f4270" stroke-width="17" stroke-linecap="round"/>
  <circle cx="646" cy="402" r="16" fill="#4b5563" stroke="#16213d" stroke-width="2"/>
  <circle cx="646" cy="402" r="5.5" fill="#22d3ee" opacity="0.9"/>
  <g stroke="#2f4270" stroke-width="7.5" stroke-linecap="round">
    <line x1="679" y1="296" x2="668" y2="268"/>
    <line x1="681" y1="296" x2="686" y2="264"/>
    <line x1="683" y1="298" x2="700" y2="277"/>
  </g>
  <path d="M 712 336 q 18 -26 12 -58" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="5 6" opacity="0.8"/>

  <!-- ====== PESCOCO E CABECA ====== -->
  <rect x="430" y="414" width="40" height="26" rx="8" fill="url(#metal)" stroke="#16213d" stroke-width="2"/>
  <rect x="372" y="276" width="156" height="134" rx="26" fill="url(#cabeca)" stroke="#0f172a" stroke-width="2.5"/>
  <!-- necessaire: mesmos frisos da mala + ziper de acesso -->
  <g stroke="#0f172a" stroke-width="1.8" opacity="0.38">
    <line x1="396" y1="292" x2="396" y2="396"/>
    <line x1="504" y1="292" x2="504" y2="396"/>
  </g>
  <path d="M 372 366 L 528 366" stroke="#0f172a" stroke-width="2.6" opacity="0.72"/>
  <path d="M 372 366 L 528 366" stroke="#7b8ab5" stroke-width="1" stroke-dasharray="3.5 3.5" opacity="0.7"/>
  <!-- visor -->
  <rect x="388" y="298" width="124" height="58" rx="17" fill="#0a1424" stroke="#0f172a" stroke-width="2"/>
  <rect x="388" y="298" width="124" height="58" rx="17" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
  <ellipse cx="424" cy="327" rx="33" ry="29" fill="url(#brilho)"/>
  <ellipse cx="476" cy="327" rx="33" ry="29" fill="url(#brilho)"/>
  <circle cx="424" cy="327" r="13" fill="url(#olho)"/>
  <circle cx="476" cy="327" r="13" fill="url(#olho)"/>
  <circle cx="420" cy="323" r="4" fill="#f0fdff" opacity="0.95"/>
  <circle cx="472" cy="323" r="4" fill="#f0fdff" opacity="0.95"/>
  <g fill="#0b1424" opacity="0.75">
    <rect x="416" y="374" width="68" height="4.5" rx="2.2"/>
    <rect x="426" y="386" width="48" height="4.5" rx="2.2"/>
  </g>
  <line x1="450" y1="276" x2="450" y2="254" stroke="#525d70" stroke-width="4" stroke-linecap="round"/>
  <circle cx="450" cy="249" r="6" fill="#22d3ee"/>
  <circle cx="450" cy="249" r="14" fill="url(#brilho)"/>

  <!-- ====== CALLOUTS ====== -->
  <g stroke="#94a3b8" stroke-width="1.3">
    <line x1="250" y1="252" x2="374" y2="292"/>
    <line x1="238" y1="330" x2="384" y2="330"/>
    <line x1="232" y1="470" x2="304" y2="470"/>
    <line x1="226" y1="546" x2="386" y2="546"/>
    <line x1="238" y1="612" x2="334" y2="611"/>
    <line x1="244" y1="700" x2="340" y2="700"/>
    <line x1="252" y1="928" x2="358" y2="928"/>
    <line x1="712" y1="330" x2="534" y2="336"/>
    <line x1="716" y1="470" x2="596" y2="470"/>
    <line x1="720" y1="530" x2="568" y2="516"/>
    <line x1="714" y1="662" x2="566" y2="662"/>
    <line x1="704" y1="742" x2="540" y2="742"/>
  </g>
  <g fill="#94a3b8">
    <circle cx="374" cy="292" r="3"/><circle cx="384" cy="330" r="3"/><circle cx="304" cy="470" r="3"/>
    <circle cx="386" cy="546" r="3"/><circle cx="334" cy="611" r="3"/><circle cx="340" cy="700" r="3"/>
    <circle cx="358" cy="928" r="3"/><circle cx="534" cy="336" r="3"/><circle cx="596" cy="470" r="3"/>
    <circle cx="568" cy="516" r="3"/><circle cx="566" cy="662" r="3"/><circle cx="540" cy="742" r="3"/>
  </g>
  <g font-size="12.5" fill="#334155">
    <text x="245" y="249" text-anchor="end">Cantos arredondados</text>
    <text x="245" y="264" text-anchor="end" font-size="10.5" fill="#64748b">nada de quina viva</text>
    <text x="233" y="327" text-anchor="end">Visor único, não 4 furos</text>
    <text x="233" y="342" text-anchor="end" font-size="10.5" fill="#64748b">acrílico fumê esconde os sensores</text>
    <text x="227" y="467" text-anchor="end">Ombro em grafite</text>
    <text x="227" y="482" text-anchor="end" font-size="10.5" fill="#64748b">fixado no reforço interno, não na casca</text>
    <text x="221" y="543" text-anchor="end">Painel de identidade</text>
    <text x="221" y="558" text-anchor="end" font-size="10.5" fill="#64748b">o peito é onde mora a marca</text>
    <text x="233" y="609" text-anchor="end">O zíper da mala continua abrindo</text>
    <text x="233" y="624" text-anchor="end" font-size="10.5" fill="#64748b">acesso total à eletrônica em 3 segundos</text>
    <text x="239" y="697" text-anchor="end">Frisos originais da mala</text>
    <text x="239" y="712" text-anchor="end" font-size="10.5" fill="#64748b">viram "design" depois de pintados</text>
    <text x="247" y="925" text-anchor="end">Saia da base</text>
    <text x="247" y="940" text-anchor="end" font-size="10.5" fill="#64748b">esconde lastro e fiação</text>
    <text x="718" y="327" text-anchor="start">Olhos acesos = "está ligado"</text>
    <text x="718" y="342" text-anchor="start" font-size="10.5" fill="#64748b">o truque mais barato que existe</text>
    <text x="722" y="467" text-anchor="start">Braços simétricos</text>
    <text x="722" y="482" text-anchor="start" font-size="10.5" fill="#64748b">mesmo comprimento dos dois lados</text>
    <text x="726" y="527" text-anchor="start">Casca já vem pronta</text>
    <text x="726" y="542" text-anchor="start" font-size="10.5" fill="#64748b">a mala poupa a etapa de "encapar"</text>
    <text x="720" y="659" text-anchor="start">Fita LED vazando pela fresta</text>
    <text x="720" y="674" text-anchor="start" font-size="10.5" fill="#64748b">R$20 que valem por R$200</text>
    <text x="710" y="739" text-anchor="start">Uma cor dominante</text>
    <text x="710" y="754" text-anchor="start" font-size="10.5" fill="#64748b">coerência &gt; material caro</text>
  </g>

  <!-- PALETA -->
  <text x="150" y="1042" font-size="12" font-weight="bold" fill="#16213d">PALETA</text>
  <g>
    <rect x="212" y="1030" width="26" height="16" rx="3" fill="#16213d" stroke="#0f172a"/>
    <text x="244" y="1042" font-size="11" fill="#334155">Navy (corpo, 60%)</text>
    <rect x="378" y="1030" width="26" height="16" rx="3" fill="#4b5563" stroke="#0f172a"/>
    <text x="410" y="1042" font-size="11" fill="#334155">Grafite (juntas, 30%)</text>
    <rect x="548" y="1030" width="26" height="16" rx="3" fill="#22d3ee" stroke="#0f172a"/>
    <text x="580" y="1042" font-size="11" fill="#334155">Ciano (acento, 10%)</text>
  </g>
</svg>
