  <!-- ============ LEGENDA ============ -->
  <rect x="836" y="92" width="172" height="1"/>
  <g font-size="11.5" fill="#e2e8f0">
    <text x="836" y="100" font-size="12.5" font-weight="bold" fill="#22d3ee">VISÃO E PERCEPÇÃO</text>
    <text x="836" y="122">2 · Anel LED WS2812 (olhos)</text>
    <text x="846" y="137" font-size="10" fill="#94a3b8">R$18 · pulsa, gira, muda de cor</text>
    <text x="836" y="158">3 · ESP32-CAM (câmera)</text>
    <text x="846" y="173" font-size="10" fill="#94a3b8">R$45 · entre os olhos, segue rosto</text>
    <text x="836" y="194">4 · 2× HC-SR04 (ultrassônico)</text>
    <text x="846" y="209" font-size="10" fill="#94a3b8">R$24 · nas têmporas, mede distância</text>

    <text x="836" y="240" font-size="12.5" font-weight="bold" fill="#22d3ee">ÁUDIO</text>
    <text x="836" y="262">1 · Microfone INMP441</text>
    <text x="846" y="277" font-size="10" fill="#94a3b8">R$20 · topo da cabeça, longe do falante</text>
    <text x="836" y="298">5 · Alto-falante da voz (3W)</text>
    <text x="846" y="313" font-size="10" fill="#94a3b8">sucata · atrás da grelha da "boca"</text>
    <text x="836" y="334">10 · Alto-falante grave (opcional)</text>
    <text x="846" y="349" font-size="10" fill="#94a3b8">sucata · torso, para som cheio</text>

    <text x="836" y="380" font-size="12.5" font-weight="bold" fill="#22d3ee">MOVIMENTO</text>
    <text x="836" y="402">6 · Servo pescoço (pan + tilt)</text>
    <text x="836" y="423">7 · Motor de limpador (ombro)</text>
    <text x="846" y="438" font-size="10" fill="#94a3b8">+ potenciômetro e fim-de-curso</text>
    <text x="836" y="459">15 · Servo do cotovelo</text>
    <text x="836" y="480">16 · Garra por tendão</text>

    <text x="836" y="511" font-size="12.5" font-weight="bold" fill="#22d3ee">INTERFACE</text>
    <text x="836" y="533">9 · Painel / display do peito</text>
    <text x="846" y="548" font-size="10" fill="#94a3b8">marca ou OLED com status</text>
    <text x="836" y="569">11 · Fita LED na linha do zíper</text>
    <text x="836" y="590">12 · Impressora térmica 58 mm</text>
    <text x="846" y="605" font-size="10" fill="#94a3b8">R$150 · cupom com QR do WhatsApp</text>

    <text x="836" y="636" font-size="12.5" font-weight="bold" fill="#f87171">ENERGIA E SEGURANÇA</text>
    <text x="836" y="658">8 · Botão de emergência</text>
    <text x="846" y="673" font-size="10" fill="#94a3b8">corta os 12V dos motores</text>
    <text x="836" y="694">13 · ESP32 + PCA9685 + drivers</text>
    <text x="846" y="709" font-size="10" fill="#94a3b8">bandeja interna (tracejado)</text>
    <text x="836" y="730">14 · Fonte ATX + fusíveis</text>
    <text x="846" y="745" font-size="10" fill="#94a3b8">no fundo da mala = peso baixo</text>
  </g>

  <!-- nota -->
  <rect x="828" y="790" width="182" height="126" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="840" y="812" font-size="11" font-weight="bold" fill="#22d3ee">POR QUE ASSIM</text>
  <text x="840" y="832" font-size="9.6" fill="#cbd5e1">Microfone longe do alto-falante,</text>
  <text x="840" y="846" font-size="9.6" fill="#cbd5e1">senão ele escuta a própria voz</text>
  <text x="840" y="860" font-size="9.6" fill="#cbd5e1">e entra em looping.</text>
  <text x="840" y="880" font-size="9.6" fill="#cbd5e1">Fonte no fundo = centro de massa</text>
  <text x="840" y="894" font-size="9.6" fill="#cbd5e1">baixo = robô não tomba quando</text>
  <text x="840" y="908" font-size="9.6" fill="#cbd5e1">o braço estende à frente.</text>

  <text x="510" y="1150" text-anchor="middle" font-size="10.5" fill="#64748b">Tracejado = componente interno (não aparece com a mala fechada) · Projeto Ferrão · 25/07/2026</text>
</svg>
