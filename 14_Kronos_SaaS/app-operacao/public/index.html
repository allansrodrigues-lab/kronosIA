<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/operacao/">
<title>Kronos Operação — Painel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/tabler-icons.min.css">
<style>
:root{
  --s0:#020c2a; --s1:#0a1738; --s2:#122150;
  --tp:#eef1fb; --ts:#9aa6c8; --tm:#6b779c;
  --bd:rgba(120,140,200,0.18); --bds:rgba(120,140,200,0.4);
  --ac:#a679ff; --acbg:rgba(120,72,200,0.22);
  --ok:#3ed6bd; --okbg:rgba(24,192,160,0.18);
  --warn:#f0b45c; --warnbg:rgba(234,159,39,0.18);
  --bad:#f08a89; --badbg:rgba(226,75,74,0.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--s0);color:var(--tp);font-family:'Inter',-apple-system,'Segoe UI',sans-serif;line-height:1.5;padding:22px 16px 60px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:17px;font-weight:600;margin:0}
.sub{font-size:12px;color:var(--tm)}
.card{background:var(--s1);border-radius:12px;padding:18px;margin-bottom:16px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 0}
.kpi{background:var(--s2);border-radius:8px;padding:12px 14px}
.kpi p{margin:0;font-size:12px;color:var(--ts)}
.kpi b{display:block;font-size:22px;font-weight:600;margin-top:2px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:0.5px solid var(--bd);cursor:pointer}
.row:hover{background:rgba(255,255,255,0.02)}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}
.b-warn{background:var(--warnbg);color:var(--warn)}
.b-bad{background:var(--badbg);color:var(--bad)}
.av{width:38px;height:38px;border-radius:50%;background:var(--acbg);display:flex;align-items:center;justify-content:center;color:var(--ac);flex-shrink:0}
.muted{color:var(--tm);font-size:12px}
button{font-family:inherit;background:transparent;border:0.5px solid var(--bds);color:var(--tp);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer}
button:hover{background:var(--s2)}
.err{background:var(--badbg);color:var(--bad);border-radius:8px;padding:12px 14px;font-size:13px;display:none}
#cliente{display:none}
.item{border-top:0.5px solid var(--bd);padding:12px 0}
.item .ihead{display:flex;align-items:center;gap:10px}
.item .ihead b{flex:1;font-size:13.5px;font-weight:600}
.item .isku{color:var(--tm);font-size:11px}
.item .iqtd{font-size:12px;color:var(--warn)}
.forn{display:flex;align-items:center;gap:8px;margin:6px 0 0 0;padding:6px 10px;background:var(--s2);border-radius:7px;font-size:12px}
.forn .tag{font-size:10px;padding:2px 7px;border-radius:12px;flex-shrink:0}
.forn .tag.principal{background:var(--okbg);color:var(--ok)}
.forn .tag.alt{background:rgba(255,255,255,0.06);color:var(--ts)}
.forn .fname{flex:1;color:var(--tp)}
.forn .fprice{font-weight:600}
.forn .fprazo{color:var(--tm);white-space:nowrap}
.parado{display:flex;align-items:center;gap:10px;border-top:0.5px solid var(--bd);padding:10px 0;font-size:13px}
.parado b{flex:1;font-weight:500}
.parado .pdias{color:var(--tm);font-size:11px;white-space:nowrap}
.parado .pval{font-weight:600;color:var(--warn);white-space:nowrap}
.approve{background:rgba(74,14,144,0.12);border:1px dashed var(--bds);border-radius:8px;padding:10px 12px;font-size:11.5px;color:var(--ts);margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="wrap">

  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
    <img src="kronos_icone.png" alt="Kronos" style="width:40px;height:40px;object-fit:contain">
    <div style="flex:1">
      <h1 id="titulo">Kronos Operação</h1>
      <span class="sub" id="upd">carregando…</span>
    </div>
    <button onclick="load(true)"><i class="ti ti-refresh"></i> Atualizar</button>
    <button onclick="sair()"><i class="ti ti-logout"></i> Sair</button>
  </div>

  <div class="err" id="err"></div>

  <div class="card" id="cockpit">
    <span class="muted" style="letter-spacing:.08em">VISÃO KRONOS — TODAS AS LOJAS</span>
    <div class="kgrid" id="totais"></div>
    <div id="lista" style="margin-top:14px"></div>
  </div>

  <div class="card" id="cliente"></div>

  <p class="muted" style="text-align:center">Kronos Intelligence · painel próprio na nuvem, isolado por loja</p>
</div>

<script>
var DATA = null, SEL = null;

function money(v){ return 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function badge(st){
  if(st==='ativo') return '<span class="badge b-ok"><i class="ti ti-circle-check"></i>Ativo</span>';
  if(st==='piloto') return '<span class="badge b-warn">Piloto</span>';
  return '<span class="badge b-bad">Suspenso</span>';
}

function render(){
  var t = DATA.totals;
  document.getElementById('upd').textContent = 'atualizado às ' + DATA.atualizadoEm + ' · lido direto do banco da loja';
  if(!t){
    document.getElementById('cockpit').style.display = 'none';
    document.getElementById('titulo').textContent = DATA.clients[0] ? DATA.clients[0].name : 'Painel';
    openClient(DATA.clients[0].id);
    return;
  }
  document.getElementById('cockpit').style.display = 'block';
  document.getElementById('titulo').textContent = 'Kronos Operação — cockpit';
  document.getElementById('totais').innerHTML =
    '<div class="kpi"><p>Receita mensal (MRR)</p><b>'+money(t.mrr)+'</b></div>'+
    '<div class="kpi"><p>Lojas ativas</p><b>'+t.ativos+'</b></div>'+
    '<div class="kpi"><p>Itens em ruptura</p><b>'+t.totalRuptura+'</b></div>'+
    '<div class="kpi"><p>Capital parado</p><b>'+money(t.totalCapitalParado)+'</b></div>';

  var h = '<div class="row" style="cursor:default;border-top:none;padding-bottom:4px">'+
    '<span class="muted" style="flex:1">Loja</span>'+
    '<span class="muted" style="width:70px;text-align:right">Ruptura</span>'+
    '<span class="muted" style="width:92px;text-align:right">Status</span></div>';
  DATA.clients.forEach(function(c){
    h += '<div class="row" onclick="openClient(\''+c.id+'\')">'+
      '<span style="flex:1;font-size:14px">'+esc(c.name)+'</span>'+
      '<span style="width:70px;text-align:right;font-size:13px">'+c.kpis.ruptura.length+'</span>'+
      '<span style="width:92px;text-align:right">'+badge(c.status)+'</span></div>';
  });
  document.getElementById('lista').innerHTML = h;
  openClient(SEL || DATA.clients[0].id);
}

function openClient(id){
  SEL = id;
  var c = DATA.clients.find(function(x){return x.id===id;});
  if(!c) return;
  var k = c.kpis;
  var h = '<span class="muted" style="letter-spacing:.08em">VISÃO DA LOJA</span>'+
    '<div style="display:flex;align-items:center;gap:12px;margin:12px 0 4px">'+
      '<div class="av"><i class="ti ti-'+c.icon+'" style="font-size:19px"></i></div>'+
      '<div style="flex:1"><p style="margin:0;font-size:15px;font-weight:600">'+esc(c.name)+'</p>'+
      '<p style="margin:0" class="muted">Plano '+esc(c.plan)+' · '+k.totalProdutos+' produtos cadastrados</p></div>'+
      badge(c.status)+'</div>'+
    '<div class="kgrid">'+
      '<div class="kpi"><p>Itens em ruptura</p><b>'+k.ruptura.length+'</b></div>'+
      '<div class="kpi"><p>Capital parado</p><b>'+money(k.totalCapitalParado)+'</b></div>'+
    '</div>';

  h += '<p style="margin:18px 0 2px;font-size:13px;font-weight:500;color:var(--ts)">Precisam de reposição</p>';
  if(k.ruptura.length===0){
    h += '<p class="muted">Nenhuma peça em ruptura hoje.</p>';
  } else {
    k.ruptura.forEach(function(p){
      h += '<div class="item"><div class="ihead"><b>'+esc(p.nome)+'</b><span class="isku">'+esc(p.sku)+'</span></div>'+
        '<div class="iqtd">'+p.quantidade_atual+' em estoque · mínimo é '+p.estoque_minimo+'</div>';
      if(p.fornecedores.length===0){
        h += '<p class="muted" style="margin:6px 0 0">Agente Fornecedores ainda não pesquisou este item.</p>';
      } else {
        p.fornecedores.forEach(function(f){
          var cls = f.tipo==='principal' ? 'principal' : 'alt';
          var label = f.tipo==='principal' ? '✅ principal' : 'alternativo';
          h += '<div class="forn"><span class="tag '+cls+'">'+label+'</span>'+
            '<span class="fname">'+esc(f.fornecedor)+' · '+esc(f.categoria_peca)+'</span>'+
            '<span class="fprice">'+money(f.preco)+'</span>'+
            '<span class="fprazo">'+f.prazo_dias+'d</span></div>';
        });
      }
      h += '</div>';
    });
    h += '<div class="approve">🔒 O Agente não compra sozinho — essas são só as opções pra você aprovar.</div>';
  }

  h += '<p style="margin:18px 0 2px;font-size:13px;font-weight:500;color:var(--ts)">Capital parado (sem venda há 90+ dias)</p>';
  if(k.parados.length===0){
    h += '<p class="muted">Nenhum item com capital parado no momento.</p>';
  } else {
    k.parados.forEach(function(p){
      h += '<div class="parado"><b>'+esc(p.nome)+'</b>'+
        '<span class="pdias">'+p.quantidade_atual+' un. · '+p.dias_parado+'d parada</span>'+
        '<span class="pval">'+money(p.valor_parado)+'</span></div>';
    });
    h += '<div class="row" style="cursor:default;border-top:1px solid var(--bd);margin-top:4px;padding-top:10px">'+
      '<span style="flex:1;font-size:13px;font-weight:600">Total parado</span>'+
      '<span style="font-size:14px;font-weight:700;color:var(--warn)">'+money(k.totalCapitalParado)+'</span></div>';
  }

  var el = document.getElementById('cliente');
  el.innerHTML = h; el.style.display = 'block';
}

function sair(){
  fetch('api/logout',{method:'POST'}).then(function(){ window.location.href='login.html'; });
}

function load(force){
  document.getElementById('upd').textContent = 'carregando…';
  fetch('api/overview').then(function(r){
    if(r.status===401){ window.location.href='login.html'; throw new Error('login'); }
    return r.json();
  }).then(function(d){
    if(d.error) throw new Error(d.error);
    DATA = d; document.getElementById('err').style.display='none'; render();
  }).catch(function(e){
    if(e.message==='login') return;
    var el = document.getElementById('err');
    el.textContent = 'Erro ao ler o painel: ' + e.message;
    el.style.display = 'block';
    document.getElementById('upd').textContent = 'erro ao carregar';
  });
}
load();
</script>
</body>
</html>
